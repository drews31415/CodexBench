<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="t d"><title id="t">AAH 시스템 아키텍처</title><desc id="d">Condition Resolver가 A–E 정책을 구성한다. Codex 실행과 관측, 공통 실패 감지, 진단, 전략 선택, 컨텍스트 구성으로 이루어진 제한된 복구 루프를 거친 뒤 최종 패치는 독립 평가 경계에서 판정된다.</desc><style>
.bg{fill:#ffffff}.t1{fill:#191919}.t2{fill:#666666}.grid{stroke:#e7e7e7}.base{stroke:#c2c2c2}
.s1{fill:#257de0}.s1l{stroke:#257de0}.s2{fill:#f47230}.s2l{stroke:#f47230}.s3{fill:#00b894}.s3l{stroke:#00b894}
.mute{fill:#c2c2c2}.mutel{stroke:#9c9c9c}.good{fill:#0aac23}.crit{fill:#dc3c3d}.warnf{fill:#fbb315}
.panel{fill:#f9f9f9;stroke:rgba(11,11,11,0.10)}.ring{stroke:#ffffff}.inv{fill:#ffffff}.dark{fill:#0b0b0b}
.arrow{stroke:#666666;fill:none}.arrowhead{fill:#666666}.accent{stroke:#257de0;fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#191919}.t1{fill:#efefef}.t2{fill:#9c9c9c}.grid{stroke:#303030}
.base{stroke:#474747}.s1{fill:#338ced}.s1l{stroke:#338ced}.s2{fill:#e76624}.s2l{stroke:#e76624}.s3{fill:#00a888}
.s3l{stroke:#00a888}.mute{fill:#474747}.mutel{stroke:#9c9c9c}.panel{fill:#0b0b0b;stroke:rgba(255,255,255,0.10)}
.ring{stroke:#191919}.arrow{stroke:#9c9c9c}.arrowhead{fill:#9c9c9c}.accent{stroke:#338ced}}
</style><rect class="bg" width="980" height="600" rx="8"/><text x="20.0" y="28.0" class="t1" font-size="16" text-anchor="start" font-weight="600">AAH 시스템 아키텍처 — 모델을 바꾸지 않는 외부 하네스</text><text x="20.0" y="46.0" class="t2" font-size="11.5" text-anchor="start">화살표: 실행 흐름 · 파란 띠: AAH가 추가한 제어 구성 요소 · 아래 회색 영역: 에이전트와 정책이 접근할 수 없는 독립 평가 경계</text><rect x="20" y="62" width="940" height="50" rx="8" class="panel"/><rect x="20" y="62" width="4" height="50" rx="2" class="s1"/><text x="32.0" y="82.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Condition Resolver (A–E)</text><text x="32.0" y="100.0" class="t2" font-size="11" text-anchor="start">초기 컨텍스트 NONE / DEFAULT / DCC · 진단 NONE / FLAT / GRAPH · 전략 NATIVE / GENERIC / TYPED — 조건은 resolver로만 구성 (개별 override 금지)</text><rect x="20" y="136" width="200" height="92" rx="8" class="panel"/><text x="32.0" y="156.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Workspace Manager</text><text x="32.0" y="174.0" class="t2" font-size="11" text-anchor="start">과제별 격리 작업 사본</text><text x="32.0" y="189.0" class="t2" font-size="11" text-anchor="start">snapshot · diff · 최종 패치 고정</text><text x="32.0" y="204.0" class="t2" font-size="11" text-anchor="start">경로 탈출 · symlink 검사</text><rect x="260" y="136" width="210" height="92" rx="8" class="panel"/><text x="272.0" y="156.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Codex Runtime</text><text x="272.0" y="174.0" class="t2" font-size="11" text-anchor="start">codex exec --json (CLI 0.166.0)</text><text x="272.0" y="189.0" class="t2" font-size="11" text-anchor="start">Windows MXC 샌드박스</text><text x="272.0" y="204.0" class="t2" font-size="11" text-anchor="start">후속 턴: exec resume (같은 세션)</text><rect x="510" y="136" width="210" height="92" rx="8" class="panel"/><text x="522.0" y="156.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Evidence Ledger</text><text x="522.0" y="174.0" class="t2" font-size="11" text-anchor="start">JSON 이벤트 정규화</text><text x="522.0" y="189.0" class="t2" font-size="11" text-anchor="start">명령 · 파일 변경 · 사용량 · 검사</text><text x="522.0" y="204.0" class="t2" font-size="11" text-anchor="start">원시 payload는 제한 영역 보관</text><rect x="760" y="136" width="200" height="92" rx="8" class="panel"/><text x="772.0" y="156.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Trusted Public Checks</text><text x="772.0" y="174.0" class="t2" font-size="11" text-anchor="start">Docker worker의 고정 suite</text><text x="772.0" y="189.0" class="t2" font-size="11" text-anchor="start">공개 기능 · 회귀 검사</text><text x="772.0" y="204.0" class="t2" font-size="11" text-anchor="start">제출 코드가 suite를 못 바꿈</text><path d="M 220,182 L 260,182" class="arrow" stroke-width="1.5"/><path d="M260,182 L252.6,185.1 L252.6,178.9 Z" class="arrowhead"/><path d="M 470,182 L 510,182" class="arrow" stroke-width="1.5"/><path d="M510,182 L502.6,185.1 L502.6,178.9 Z" class="arrowhead"/><path d="M 720,182 L 760,182" class="arrow" stroke-width="1.5"/><path d="M760,182 L752.6,185.1 L752.6,178.9 Z" class="arrowhead"/><rect x="760" y="284" width="200" height="140" rx="8" class="panel"/><rect x="760" y="284" width="4" height="140" rx="2" class="s1"/><text x="772.0" y="304.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Failure Detector</text><text x="772.0" y="322.0" class="t2" font-size="11" text-anchor="start">B–E 공통 규칙 · 앵커 · 상한</text><text x="772.0" y="337.0" class="t2" font-size="11" text-anchor="start">T1 반복 실패</text><text x="772.0" y="352.0" class="t2" font-size="11" text-anchor="start">T2 탐색 정체</text><text x="772.0" y="367.0" class="t2" font-size="11" text-anchor="start">T3 회귀</text><text x="772.0" y="382.0" class="t2" font-size="11" text-anchor="start">T4 완료 선언 후 실패</text><text x="772.0" y="397.0" class="t2" font-size="11" text-anchor="start">T5 UNKNOWN / INFRA</text><rect x="440" y="284" width="280" height="140" rx="8" class="panel"/><rect x="440" y="284" width="4" height="140" rx="2" class="s1"/><text x="452.0" y="304.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Diagnosis</text><text x="452.0" y="322.0" class="t2" font-size="11" text-anchor="start">FLAT (B·C): 실패 증거 목록</text><text x="452.0" y="337.0" class="t2" font-size="11" text-anchor="start">GRAPH (D·E):</text><text x="452.0" y="352.0" class="t2" font-size="11" text-anchor="start">· Repository Graph — AST 파일·클래스·함수·호출</text><text x="452.0" y="367.0" class="t2" font-size="11" text-anchor="start">· Execution Graph — 명령·검사·실패·변경</text><text x="452.0" y="382.0" class="t2" font-size="11" text-anchor="start">· Cross-Graph Mapping — TESTS_TARGET·FAILS_AT</text><text x="452.0" y="397.0" class="t2" font-size="11" text-anchor="start">· 제한 탐색 depth 4 · visit 200 · top-k 8</text><rect x="230" y="284" width="170" height="140" rx="8" class="panel"/><rect x="230" y="284" width="4" height="140" rx="2" class="s1"/><text x="242.0" y="304.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Strategy Selector</text><text x="242.0" y="322.0" class="t2" font-size="11" text-anchor="start">REVIEW_REGRESSION</text><text x="242.0" y="337.0" class="t2" font-size="11" text-anchor="start">RELOCALIZE</text><text x="242.0" y="352.0" class="t2" font-size="11" text-anchor="start">REFRESH_EVIDENCE</text><text x="242.0" y="367.0" class="t2" font-size="11" text-anchor="start">GENERIC_RETRY</text><text x="242.0" y="382.0" class="t2" font-size="11" text-anchor="start">CONTINUE · STOP</text><text x="242.0" y="397.0" class="t2" font-size="11" text-anchor="start">(근거 부족 → GENERIC)</text><rect x="20" y="284" width="170" height="140" rx="8" class="panel"/><rect x="20" y="284" width="4" height="140" rx="2" class="s1"/><text x="32.0" y="304.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Context Builder</text><text x="32.0" y="322.0" class="t2" font-size="11" text-anchor="start">DEFAULT (B·D)</text><text x="32.0" y="337.0" class="t2" font-size="11" text-anchor="start">공통 최소 근거</text><text x="32.0" y="352.0" class="t2" font-size="11" text-anchor="start">DCC (C·E)</text><text x="32.0" y="367.0" class="t2" font-size="11" text-anchor="start">관련성·유효성·중복·예산</text><text x="32.0" y="382.0" class="t2" font-size="11" text-anchor="start">보조 정보 상한</text><text x="32.0" y="397.0" class="t2" font-size="11" text-anchor="start">2,048 추정 토큰</text><path d="M 860,228 L 860,284" class="arrow" stroke-width="1.5"/><path d="M860,284 L856.9,276.6 L863.1,276.6 Z" class="arrowhead"/><text x="868.0" y="262.0" class="t2" font-size="10.5" text-anchor="start">공개 검사 결과</text><path d="M 760,354 L 720,354" class="arrow" stroke-width="1.5"/><path d="M720,354 L727.4,350.9 L727.4,357.1 Z" class="arrowhead"/><path d="M 440,354 L 400,354" class="arrow" stroke-width="1.5"/><path d="M400,354 L407.4,350.9 L407.4,357.1 Z" class="arrowhead"/><path d="M 230,354 L 190,354" class="arrow" stroke-width="1.5"/><path d="M190,354 L197.4,350.9 L197.4,357.1 Z" class="arrowhead"/><path d="M 105,284 L 105,256 L 365,256 L 365,228" class="arrow" stroke-width="1.5"/><path d="M365,228 L368.1,235.4 L361.9,235.4 Z" class="arrowhead"/><text x="113.0" y="273.0" class="t2" font-size="10.5" text-anchor="start">복구 턴 전달 (최대 2회 · 새 관측 필요 · 같은 체크포인트 중복 금지)</text><rect x="20" y="456" width="940" height="128" rx="8" class="mute" opacity="0.28"/><text x="32.0" y="476.0" class="t1" font-size="12" text-anchor="start" font-weight="600">독립 평가 경계 — 판정 결과는 Runtime · Graph · DCC · Recovery로 역류하지 않는다</text><rect x="700" y="488" width="248" height="84" rx="8" class="panel"/><text x="712.0" y="508.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Patch Freeze</text><text x="712.0" y="526.0" class="t2" font-size="11" text-anchor="start">정상 종료 · STOP · 한도 도달 후</text><text x="712.0" y="541.0" class="t2" font-size="11" text-anchor="start">최종 패치를 고정 (patch_hash)</text><rect x="380" y="488" width="280" height="84" rx="8" class="panel"/><text x="392.0" y="508.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Independent Evaluator</text><text x="392.0" y="526.0" class="t2" font-size="11" text-anchor="start">저장소 밖 큐레이터 키트 (Docker)</text><text x="392.0" y="541.0" class="t2" font-size="11" text-anchor="start">비공개 기능 · 회귀 · 지침 판정</text><rect x="32" y="488" width="308" height="84" rx="8" class="panel"/><text x="44.0" y="508.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">Analysis · Evidence · Dashboard</text><text x="44.0" y="526.0" class="t2" font-size="11" text-anchor="start">동결 분석 · cluster bootstrap 10,000회</text><text x="44.0" y="541.0" class="t2" font-size="11" text-anchor="start">바이트 재현 · 공개 묶음 · 대시보드</text><path d="M 900,424 L 900,488" class="arrow" stroke-width="1.5"/><path d="M900,488 L896.9,480.6 L903.1,480.6 Z" class="arrowhead"/><text x="908.0" y="446.0" class="t2" font-size="10.5" text-anchor="start">종료</text><path d="M 700,530 L 660,530" class="arrow" stroke-width="1.5"/><path d="M660,530 L667.4,526.9 L667.4,533.1 Z" class="arrowhead"/><path d="M 380,530 L 340,530" class="arrow" stroke-width="1.5"/><path d="M340,530 L347.4,526.9 L347.4,533.1 Z" class="arrowhead"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-labelledby="t d"><title id="t">Main v1/v2 에이전트 명령 결과</title><desc id="d">v1은 에이전트 명령 167개가 모두 비정상 종료했고 v2는 97개 중 81개가 exit 0으로 끝났다.</desc><style>
.bg{fill:#ffffff}.t1{fill:#191919}.t2{fill:#666666}.grid{stroke:#e7e7e7}.base{stroke:#c2c2c2}
.s1{fill:#257de0}.s1l{stroke:#257de0}.s2{fill:#f47230}.s2l{stroke:#f47230}.s3{fill:#00b894}.s3l{stroke:#00b894}
.mute{fill:#c2c2c2}.mutel{stroke:#9c9c9c}.good{fill:#0aac23}.crit{fill:#dc3c3d}.warnf{fill:#fbb315}
.panel{fill:#f9f9f9;stroke:rgba(11,11,11,0.10)}.ring{stroke:#ffffff}.inv{fill:#ffffff}.dark{fill:#0b0b0b}
.arrow{stroke:#666666;fill:none}.arrowhead{fill:#666666}.accent{stroke:#257de0;fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#191919}.t1{fill:#efefef}.t2{fill:#9c9c9c}.grid{stroke:#303030}
.base{stroke:#474747}.s1{fill:#338ced}.s1l{stroke:#338ced}.s2{fill:#e76624}.s2l{stroke:#e76624}.s3{fill:#00a888}
.s3l{stroke:#00a888}.mute{fill:#474747}.mutel{stroke:#9c9c9c}.panel{fill:#0b0b0b;stroke:rgba(255,255,255,0.10)}
.ring{stroke:#191919}.arrow{stroke:#9c9c9c}.arrowhead{fill:#9c9c9c}.accent{stroke:#338ced}}
</style><rect class="bg" width="760" height="240" rx="8"/><text x="16.0" y="24.0" class="t1" font-size="15" text-anchor="start" font-weight="600">Main v1 결함 발견과 v2 재실행: 에이전트 명령 종료 코드</text><text x="16.0" y="40.0" class="t2" font-size="11.5" text-anchor="start">정규화 evidence 기록의 COMMAND_RESULT 집계 · v1 비정상 종료는 모두 MXC launcher SYSTEMROOT 누락 오류 (EL-20261127-034)</text><text x="16.0" y="88.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">v1 (무효)</text><text x="16.0" y="104.0" class="t2" font-size="10.5" text-anchor="start">aah-main-emergency-v1</text><rect x="190.0" y="74" width="378.0" height="20" rx="3" class="crit" data-tip="v1 (무효) exit ≠ 0: 167건"><title>v1 (무효) exit ≠ 0: 167건</title></rect><text x="576.0" y="89.0" class="t1" font-size="11.5" text-anchor="start">exit 0: 0 · exit ≠ 0: 167 (총 167)</text><text x="190.0" y="112.0" class="t2" font-size="11" text-anchor="start">빈 패치 실패 17건 · 성공 20/40</text><text x="16.0" y="144.0" class="t1" font-size="12.5" text-anchor="start" font-weight="600">v2 (유효·탐색적)</text><text x="16.0" y="160.0" class="t2" font-size="10.5" text-anchor="start">aah-main-emergency-v2</text><rect x="190.0" y="130" width="182.3" height="20" rx="3" class="s1" data-tip="v2 (유효·탐색적) exit 0: 81건"><title>v2 (유효·탐색적) exit 0: 81건</title></rect><rect x="374.3" y="130" width="34.4" height="20" rx="3" class="crit" data-tip="v2 (유효·탐색적) exit ≠ 0: 16건"><title>v2 (유효·탐색적) exit ≠ 0: 16건</title></rect><text x="416.7" y="145.0" class="t1" font-size="11.5" text-anchor="start">exit 0: 81 · exit ≠ 0: 16 (총 97)</text><text x="190.0" y="168.0" class="t2" font-size="11" text-anchor="start">빈 패치 실패 2건 · 성공 33/40</text><rect x="190" y="186" width="12" height="12" rx="2" class="s1"/><text x="208.0" y="196.0" class="t2" font-size="11" text-anchor="start">exit 0</text><rect x="270" y="186" width="12" height="12" rx="2" class="crit"/><text x="288.0" y="196.0" class="t2" font-size="11" text-anchor="start">exit ≠ 0</text><text x="16.0" y="228.0" class="t2" font-size="10.5" text-anchor="start">v2의 exit ≠ 0 16건은 실패하는 테스트 실행 등 정상적인 명령 결과다. 실행 불가 감지(AGENT_SHELL_UNAVAILABLE)는 0회.</text></svg>
